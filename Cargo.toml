[package]
name = "dynamic-island"
version = "0.1.0"
edition = "2021"
description = "Apple-style Dynamic Island music player for Windows 11 (Spotify, Yandex Music, any SMTC player)"
license = "MIT"
repository = "https://github.com/tonight80/Dynamic-Island-Win11"
build = "build.rs"

[dependencies]
# Software renderer only: for a small overlay it is far cheaper than an
# OpenGL context (~30 MB vs ~130 MB RAM) and supports per-pixel transparency.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
tray-icon = "0.21"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
